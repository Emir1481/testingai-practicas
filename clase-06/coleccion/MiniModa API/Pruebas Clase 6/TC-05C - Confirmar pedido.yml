docs: "Cierra el carrito. Acepta el encabezado `Idempotency-Key`: si llega otra vez la misma clave con el mismo cuerpo, devuelve el mismo pedido con el encabezado `Idempotent-Replayed: true` y no crea otro. Si la clave llega con un cuerpo distinto, responde 422."
