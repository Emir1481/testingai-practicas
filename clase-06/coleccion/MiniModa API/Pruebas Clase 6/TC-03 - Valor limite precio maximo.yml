info:
  name: TC-03 - Valor limite precio maximo
  type: http
  seq: 4
  tags:
    - Productos

http:
  method: GET
  url: "{{baseUrl}}/productos?max=0"
  params:
    - name: max
      value: "0"
      type: query
    - name: edad
      value: ""
      type: query
      description: Comienzo de la categoría de edad, por ejemplo `Bebé` o `Niño`.
      disabled: true
    - name: color
      value: ""
      type: query
      description: Color exacto, sin distinguir mayúsculas.
      disabled: true
    - name: max
      value: "0"
      type: query
      description: "Precio máximo, inclusive: devuelve los productos con precio menor o igual a `max`."
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Contrato: paths./productos.get.responses.200
        test("TC-03 - Estado HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        // Contrato: components.schemas.ListaProductos
        test("Validar estructura de la respuesta", function () {
            const body = res.getBody();

            expect(body.pagina).to.be.a("number");
            expect(body.limite).to.be.a("number");
            expect(body.total).to.be.a("number");
            expect(body.productos).to.be.an("array");
        });

        // Contrato: paths./productos.get.parameters (max)
        // Precio máximo inclusive, mínimo permitido 0
        test("Todos los productos cumplen el precio maximo", function () {
            const productos = res.getBody().productos;

            expect(productos).to.be.an("array");

            productos.forEach(producto => {
                expect(producto.precio).to.be.a("number");
                expect(producto.precio).to.be.at.most(0);
            });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

