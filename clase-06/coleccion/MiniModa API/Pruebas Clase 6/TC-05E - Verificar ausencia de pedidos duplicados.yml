info:
  name: TC-05E - Verificar ausencia de pedidos duplicados
  type: http
  seq: 11
  tags:
    - Pedidos

http:
  method: GET
  url: "{{baseUrl}}/pedidos?pagina=1&limite=100"
  params:
    - name: pagina
      value: "1"
      type: query
    - name: limite
      value: "100"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Contrato: paths./pedidos.get.responses.200
        test("TC-05E - Estado HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        // Contrato: components.schemas.ListaPedidos
        test("Validar listado de pedidos", function () {
            const body = res.getBody();

            expect(body.pedidos).to.be.an("array");
            expect(body.total).to.be.a("number");
        });

        // Contrato: paths./pedidos.post.description
        test("No se genero un pedido duplicado", function () {
            const body = res.getBody();

            // Comprobar que se recuperaron todos los pedidos
            expect(body.pedidos.length).to.equal(body.total);

            const pedidos = body.pedidos.filter(
                pedido => pedido.carritoId === bru.getVar("carritoIdTC05")
            );

            expect(pedidos).to.have.lengthOf(1);
            expect(pedidos[0].id).to.equal(
                bru.getVar("pedidoIdTC05")
            );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Página de pedidos.
    request:
      url: "{{baseUrl}}/pedidos"
      method: GET
      params:
        - name: pagina
          value: "1"
          type: query
          description: Número de página, desde 1.
        - name: limite
          value: "10"
          type: query
          description: Cantidad de elementos por página.
    response:
