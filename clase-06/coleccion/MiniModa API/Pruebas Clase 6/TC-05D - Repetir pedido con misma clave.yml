info:
  name: TC-05D - Repetir pedido con misma clave
  type: http
  seq: 10
  tags:
    - Pedidos

http:
  method: POST
  url: "{{baseUrl}}/pedidos"
  headers:
    - name: Idempotency-Key
      value: "\t{{claveTC05}}"
      description: Clave única elegida por el cliente para poder reintentar sin duplicar el pedido.
  body:
    type: json
    data: |-
      {
        "carritoId": "{{carritoIdTC05}}",
        "email": "ana@ejemplo.com",
        "tarjeta": "4111111111111111",
        "pais": "AR"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Contrato: paths./pedidos.post.responses.201
        test("TC-05D - Estado HTTP 201", function () {
            expect(res.getStatus()).to.equal(201);
        });

        // Contrato: paths./pedidos.post.description
        test("El ID del pedido es el mismo", function () {
            expect(res.getBody().id).to.equal(
                bru.getVar("pedidoIdTC05")
            );
        });

        // Contrato: paths./pedidos.post.responses.201.headers
        test("Validar encabezado Idempotent-Replayed", function () {
            expect(res.getHeader("idempotent-replayed"))
                .to.equal("true");
        });

        // Contrato: paths./pedidos.post.description
        test("La respuesta coincide con el pedido original", function () {
            const original = JSON.parse(
                bru.getVar("pedidoOriginalTC05")
            );

            expect(res.getBody()).to.deep.equal(original);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Pedido confirmado.
    request:
      url: "{{baseUrl}}/pedidos"
      method: POST
      headers:
        - name: Idempotency-Key
