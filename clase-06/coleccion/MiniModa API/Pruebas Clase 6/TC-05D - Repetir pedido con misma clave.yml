    request:
      url: "{{baseUrl}}/pedidos"
      method: POST
      headers:
        - name: Idempotency-Key
          value: ""
          description: Clave única elegida por el cliente para poder reintentar sin duplicar el pedido.
          disabled: true
      body:
        type: json
        data: |-
          {
            "carritoId": "c-1",
